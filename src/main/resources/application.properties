spring.application.name=backendcarrito

# Puerto del servidor dentro del contenedor
server.port=${SERVER_PORT:8080}

# IMPORTANTE: Lee las cabeceras de AWS API Gateway para reconocer que viene por HTTPS
server.forward-headers-strategy=framework

# Conexión a MongoDB con los valores provistos
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_ROOT_USER}
spring.data.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB}

# Serialización JSON
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Documentación Swagger / OpenAPI
springdoc.swagger-ui.path=/api/carritos/swagger-ui.html
springdoc.api-docs.path=/api/carritos/v3/api-docs

# (Opcional) Forzar la URL base HTTPS si la propiedad anterior no fuera suficiente en tu entorno de AWS
springdoc.servers[0].url=https://qjxnz9uqv9.execute-api.us-east-1.amazonaws.com
springdoc.servers[0].description=AWS API Gateway HTTPS

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.example.backendcarrito=INFO
