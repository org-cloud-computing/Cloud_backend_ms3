spring.application.name=backendcarrito

# Puerto del servidor dentro del contenedor
server.port=${SERVER_PORT:8080}

# Conexión a MongoDB con los valores provistos
# Se configuran propiedades directas para no romper el parsing de contraseñas con caracteres especiales (@, $, !)
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_ROOT_USER}
spring.data.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB}

# Serialización JSON (compatible con schema_del_ms3.txt)
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Documentación Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.example.backendcarrito=INFO
